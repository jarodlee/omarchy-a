<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>iPad 电池监测</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif;background:#f5f6f8;color:#20252c}*{box-sizing:border-box}body{max-width:960px;margin:auto;padding:24px 16px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:24px;margin:0 0 8px}p{line-height:1.65}.muted{color:#65707c;font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.card,section{background:#fff;border:1px solid #e0e5eb;border-radius:16px;padding:18px}.label{font-size:13px;color:#65707c}.value{font-size:27px;font-weight:650;margin-top:8px;overflow-wrap:anywhere}.unit{font-size:14px;font-weight:400}.notice{padding:14px 16px;border-radius:12px;background:#edf3fa;line-height:1.6}.warning{background:#fff3d6;color:#775000}section{margin-top:16px}h2{font-size:17px;margin:0 0 12px}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}select,button{font:inherit;padding:8px 12px;border:1px solid #ccd4df;border-radius:8px;background:transparent;color:inherit}svg{width:100%;height:auto;display:block;overflow:visible}svg text{fill:currentColor;font:12px system-ui}svg .grid{stroke:#cbd3df;opacity:.5}svg .series{fill:none;stroke:#356de1;stroke-width:2.5;vector-effect:non-scaling-stroke}.empty{padding:36px 8px;text-align:center;color:#65707c}footer{font-size:13px;line-height:1.8;margin-top:22px;color:#65707c}@media(max-width:540px){body{padding:18px 12px}.cards{grid-template-columns:repeat(2,1fr);gap:8px}.card{padding:14px}.value{font-size:24px}header{align-items:flex-start}h1{font-size:21px}}@media(prefers-color-scheme:dark){:root{background:#15181d;color:#edf0f6}.card,section{background:#1e232b;border-color:#353d49}.muted,.label,footer,.empty{color:#a8b2c0}.notice{background:#23354c}.warning{background:#483b1e;color:#ffe4a4}svg .grid{stroke:#6e7c90}svg .series{stroke:#8ab0ff}}
</style>
<header><div><h1>iPad 电池监测</h1><div class="muted" id="updated">正在读取设备状态…</div></div><button id="refresh">刷新</button></header>
<div class="cards"><div class="card"><div class="label">电量</div><div class="value" id="capacity">—</div></div><div class="card"><div class="label">电池状态</div><div class="value" id="status">—</div></div><div class="card"><div class="label">电池净电流</div><div class="value" id="current">—</div></div><div class="card"><div class="label">电池温度</div><div class="value" id="temperature">—</div></div><div class="card"><div class="label">输入限流</div><div class="value" id="limit">—</div></div><div class="card"><div class="label">电池电压</div><div class="value" id="voltage">—</div></div></div>
<div id="notice" class="notice">正在读取充电来源…</div>
<section><div class="toolbar"><h2>电量变化</h2><select id="hours" aria-label="历史时间范围"><option value="1">最近 1 小时</option><option value="6" selected>最近 6 小时</option><option value="24">最近 24 小时</option></select></div><div id="capacity-chart"></div></section>
<section><h2>电池净电流 · A</h2><div id="current-chart"></div><p class="muted">正数表示电流流入电池，负数表示电池净放电。输入限流是驱动允许的上限，不是实际充电电流。电池仪表和限流的更新时间不同，短时读数可能不同步。</p></section>
<footer>每 20 秒刷新当前状态，每分钟记录一次历史，保留 7 天。页面只读取状态，不控制充电、不修改电流或驱动。<br>刚启用时历史较少，保持运行后会逐渐形成曲线。时间按当前浏览设备的时区显示。</footer>
<script>
const $=id=>document.getElementById(id);let pending=false;
const statusNames={Charging:'正在充电',Discharging:'正在放电',Full:'已充满','Not charging':'未充电',Unknown:'未知'};
const num=(v,scale=1,digits=0)=>v===null||v===undefined?'—':(v/scale).toFixed(digits);
const svgNS='http://www.w3.org/2000/svg';
function shape(tag,attrs,text){let e=document.createElementNS(svgNS,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function chart(id,rows,key,scale,unit,minimum,maximum){let host=$(id);host.replaceChildren();let valid=rows.filter(r=>r[key]!==null);if(!valid.length){let e=document.createElement('div');e.className='empty';e.textContent='正在积累历史数据';host.append(e);return}
let vals=valid.map(r=>r[key]/scale),lo=minimum??Math.min(0,...vals),hi=maximum??Math.max(0,...vals);if(hi-lo<.2){hi+=.1;lo-=.1}let t0=valid[0].timestamp,t1=valid.at(-1).timestamp;if(t1===t0)t1=t0+60;
let width=Math.max(260,host.clientWidth);let svg=shape('svg',{viewBox:'0 0 '+width+' 200',role:'img','aria-label':unit+'历史曲线'}),x=t=>46+(t-t0)/(t1-t0)*(width-58),y=v=>160-(v-lo)/(hi-lo)*140;
for(let i=0;i<4;i++){let v=lo+(hi-lo)*i/3,yy=y(v);svg.append(shape('line',{x1:46,y1:yy,x2:width-12,y2:yy,class:'grid'}),shape('text',{x:38,y:yy+4,'text-anchor':'end'},v.toFixed(scale===1?0:2)))}
if(lo<0&&hi>0)svg.append(shape('line',{x1:46,y1:y(0),x2:width-12,y2:y(0),class:'grid','stroke-dasharray':'4 4'}));
svg.append(shape('polyline',{points:valid.map(r=>x(r.timestamp)+','+y(r[key]/scale)).join(' '),class:'series'}));if(valid.length===1)svg.append(shape('circle',{cx:x(valid[0].timestamp),cy:y(vals[0]),r:3,fill:'currentColor'}));
let fmt=t=>new Date(t*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});svg.append(shape('text',{x:46,y:187},fmt(t0)),shape('text',{x:width-12,y:187,'text-anchor':'end'},fmt(t1)));host.append(svg)}
async function refresh(){if(pending)return;pending=true;try{let r=await fetch('/api/battery?hours='+$('hours').value,{cache:'no-store'});if(!r.ok)throw Error();let d=await r.json(),c=d.current;$('capacity').textContent=num(c.capacity)+'%';$('status').textContent=statusNames[c.status]||c.status||'未知';$('current').textContent=num(c.current_uA,1e6,2)+' A';$('temperature').textContent=num(c.temperature_deciC,10,1)+'℃';$('limit').textContent=num(c.input_limit_uA,1e6,2)+' A';$('voltage').textContent=num(c.voltage_uV,1e6,2)+' V';$('updated').textContent='更新于 '+new Date(c.timestamp*1000).toLocaleString();let source=(c.usb_type||'').match(/\[([^\]]+)\]/)?.[1]||'未知',notice=$('notice');notice.className='notice';let text=c.online===1?'已连接电源 · 来源 '+source:'未连接外部电源';if(c.online===1&&c.current_uA<0){text+='。当前电池净放电，请观察充电是否恢复。';notice.classList.add('warning')}if(c.temperature_deciC>=400){text+=' 电池温度偏高。';notice.classList.add('warning')}if(c.capacity<=15){text+=' 电量较低。';notice.classList.add('warning')}notice.textContent=text;chart('capacity-chart',d.history,'capacity',1,'电量',0,100);chart('current-chart',d.history,'current_uA',1e6,'电流');}catch{$('updated').textContent='暂时无法读取，请检查 iPad 网络后刷新。'}finally{pending=false}}
$('refresh').onclick=refresh;$('hours').onchange=refresh;refresh();setInterval(()=>{if(!document.hidden)refresh()},20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></html>
